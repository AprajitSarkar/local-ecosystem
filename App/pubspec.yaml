name: local_ecosystem
description: "Local Ecosystem — trusted local-network device sharing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.1

  # Networking / security
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # Permissions & platform
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  file_picker: ^8.3.7

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Preferences
  shared_preferences: ^2.3.5

  # Crypto
  crypto: ^3.0.6

  # Share / OS integration
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # UI helpers
  intl: ^0.20.2
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  nsd: ^4.0.0
  device_info_plus: ^12.4.0
  http: ^1.2.2
  win32: ^5.5.0
  ffi: ^2.1.3
  desktop_drop: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/web_portal/
    - assets/web_portal/icons/
    - assets/web_portal/canvaskit/
    - assets/web_portal/canvaskit/chromium/
